<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>AaharWalk — food, walking & home-workout coach</title>
  <meta name="description" content="A private, offline-first coach for Indian and Maharashtrian eating, daily steps, water and 15–20 minute home workouts.">
  <meta name="theme-color" content="#12766a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101413" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AaharWalk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <noscript>
    <div class="boot-error">
      <strong>AaharWalk needs JavaScript.</strong>
      <p>Everything runs on your device — there is no server — so the app can't work with scripts turned off.</p>
    </div>
  </noscript>

  <!-- Shown only if the app never boots (e.g. opened straight off the filesystem). -->
  <div id="bootHelp" class="boot-error" hidden>
    <strong>Almost there — AaharWalk needs to be served over http.</strong>
    <p>Browsers block JavaScript modules on <code>file://</code> pages. From this folder run:</p>
    <p><code>python3 -m http.server 8000</code></p>
    <p>then open <code>http://localhost:8000</code>. To install it on a phone, host the folder on any HTTPS site — see <code>INSTALL_MOBILE.md</code>.</p>
  </div>

  <div id="installCard" class="install-card" hidden>
    <button id="installAppButton" class="btn sm" type="button">Install AaharWalk</button>
    <button id="installDismiss" class="icon-btn" type="button" aria-label="Not now" style="margin-left:8px">✕</button>
  </div>

  <script type="module" src="src/main.js"></script>
  <script src="pwa.js" defer></script>
  <script>
    setTimeout(function () {
      if (!window.__AW_BOOTED) document.getElementById("bootHelp").hidden = false;
    }, 1200);
  </script>
</body>
</html>
